services:
  xiaozhi-esp32-server:
    image: xiaozhi-fork-server:3219a280
    pull_policy: build
    build:
      context: ../..
      dockerfile: Dockerfile-server-fork

  xiaozhi-esp32-server-web:
    image: xiaozhi-fork-web:3219a280
    pull_policy: build
    build:
      context: ../..
      dockerfile: Dockerfile-web-fork
    environment:
      SPRING_DATASOURCE_DRUID_PASSWORD: ${XIAOZHI_MYSQL_PASSWORD}

  xiaozhi-esp32-server-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${XIAOZHI_MYSQL_PASSWORD}

  piper-tts:
    build:
      context: ../..
      dockerfile: Dockerfile-piper-tts
    image: xiaozhi-fork-piper-tts:1.8.0
    profiles: ["local-tts"]
    restart: unless-stopped
    volumes:
      - ./models/piper:/models:ro
    networks:
      - default

  sherpa-tts:
    build:
      context: ../..
      dockerfile: Dockerfile-sherpa-tts
    image: xiaozhi-fork-sherpa-tts:2.0.3
    profiles: ["local-tts"]
    restart: unless-stopped
    volumes:
      - ./models/sherpa-tts:/models:ro
    networks:
      - default
